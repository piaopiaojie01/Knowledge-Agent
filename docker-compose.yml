services:
  mysql:
    image: mysql:8.0
    container_name: ka-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: knowledge_agent
      MYSQL_USER: ka_user
      MYSQL_PASSWORD: ka_pass_2024
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ka-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS:-ka_redis_dev_2026}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    container_name: ka-etcd
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: ka-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: ka-milvus
    image: milvusdb/milvus:v2.3.3
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  backend:
    container_name: ka-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      KA_DEEPSEEK_API_KEY: ${KA_DEEPSEEK_API_KEY:-}
      # P0：内部密钥 + Agent 地址 + Redis 口令
      AGENT_URL: http://agent:8000
      AGENT_API_KEY: ${KA_INTERNAL_API_KEY:-ka-internal-dev-key}
      REDIS_PASSWORD: ${REDIS_PASS:-ka_redis_dev_2026}
      KA_CHART_DIR: /app/charts
      KA_ICON_DIR: /app/icons
    volumes:
      - ka_charts:/app/charts
      - ka_icons:/app/icons
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    container_name: ka-agent
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KA_DEEPSEEK_API_KEY: ${KA_DEEPSEEK_API_KEY:-}
      # P0：内部鉴权密钥（与 backend AGENT_API_KEY 保持一致）
      KA_INTERNAL_API_KEY: ${KA_INTERNAL_API_KEY:-ka-internal-dev-key}
      KA_REDIS_PASSWORD: ${REDIS_PASS:-ka_redis_dev_2026}
      KA_CHART_OUTPUT_DIR: /data/charts
      KA_ICON_OUTPUT_DIR: /data/icons
      KA_CHART_BASE_URL: http://localhost
      HF_HUB_OFFLINE: "0"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
    volumes:
      - ka_charts:/data/charts
      - ka_icons:/data/icons
      - ka_agent_data:/app/data
    depends_on:
      - milvus

  nginx:
    container_name: ka-nginx
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - agent

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  ka_charts:
  ka_icons:
  ka_agent_data:
