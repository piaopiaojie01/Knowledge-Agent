# Knowledge Agent Nginx — Vue SPA + 反向代理
# 部署路径: /etc/nginx/sites-available/ka
upstream ka_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name knowledge-agent.your-company.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name knowledge-agent.your-company.com;

    ssl_certificate     /etc/nginx/ssl/ka.crt;
    ssl_certificate_key /etc/nginx/ssl/ka.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    client_max_body_size 500M;

    # Vue SPA 静态资源 + HTML5 History 回退
    location / {
        root /var/www/ka;
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot REST API
    location /api/ {
        proxy_pass http://ka_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 图表/图标静态资源（Spring Boot 生成）
    location /charts/ {
        proxy_pass http://ka_backend;
    }
    location /icons/ {
        proxy_pass http://ka_backend;
    }

    # 健康检查
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
