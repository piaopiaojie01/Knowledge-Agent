services:
  mysql:
    image: mysql:8.0
    container_name: ka-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?DB_ROOT_PASS 必须设置（/etc/ka.env）}
      MYSQL_DATABASE: knowledge_agent
      MYSQL_USER: ka_user
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS 必须设置（/etc/ka.env）}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ka-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASS:?REDIS_PASS 必须设置（/etc/ka.env）}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ka-etcd
    restart: always
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "127.0.0.1:2379:2379"

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: ka-minio
    restart: always
    command: minio server /minio_data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 必须设置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须设置}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: ka-milvus
    restart: always
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 必须设置}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须设置}
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"

  # === 应用服务（先 npm run build，再 docker compose up）===
  backend:
    container_name: ka-backend
    build: ../backend
    restart: always
    ports:
          - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KA_DEEPSEEK_API_KEY: ${KA_DEEPSEEK_API_KEY:-}
      # P0：内部密钥 + Agent 地址 + Redis 口令
      AGENT_URL: http://agent:8000
      AGENT_API_KEY: ${KA_INTERNAL_API_KEY:?KA_INTERNAL_API_KEY 必须设置}
      REDIS_PASSWORD: ${REDIS_PASS:?REDIS_PASS 必须设置（/etc/ka.env）}
      KA_ADMIN_USERNAME: ${KA_ADMIN_USERNAME:-admin}
      KA_ADMIN_PASSWORD: ${KA_ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
      KA_CHART_DIR: /app/charts
      KA_ICON_DIR: /app/icons
      # 容器内连接中间件（不能指向容器自身 localhost）
      DB_URL: jdbc:mysql://mysql:3306/knowledge_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&connectionCollation=utf8mb4_unicode_ci
      DB_USER: ka_user
      DB_PASS: ${DB_PASS:?DB_PASS 必须设置}
    volumes:
      - ka_charts:/app/charts
      - ka_icons:/app/icons
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    container_name: ka-agent
    build: ../agent
    restart: always
    environment:
      KA_DEEPSEEK_API_KEY: ${KA_DEEPSEEK_API_KEY:-}
      # P0：内部鉴权密钥（与 backend AGENT_API_KEY 保持一致）
      KA_INTERNAL_API_KEY: ${KA_INTERNAL_API_KEY:?KA_INTERNAL_API_KEY 必须设置}
      KA_REDIS_PASSWORD: ${REDIS_PASS:?REDIS_PASS 必须设置（/etc/ka.env）}
      KA_CHART_OUTPUT_DIR: /data/charts
      KA_ICON_OUTPUT_DIR: /data/icons
      KA_CHART_BASE_URL: https://knowledge-agent.your-company.com
      HF_HUB_OFFLINE: "0"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      KA_REDIS_HOST: redis
      KA_REDIS_PORT: "6379"
    volumes:
      - ka_charts:/data/charts
      - ka_icons:/data/icons
      - ka_agent_data:/app/data
    depends_on:
      - milvus

  nginx:
    container_name: ka-nginx
    build: ../frontend
    restart: always
    ports:
          - "${HTTP_PORT:-80}:80"
          - "${HTTPS_PORT:-443}:443"
    depends_on:
      - backend
      - agent

volumes:
  mysql_data:
  redis_data:
  minio_data:
  ka_charts:
  ka_icons:
  ka_agent_data:
