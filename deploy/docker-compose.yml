version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: ka-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-ka_root_2024}
      MYSQL_DATABASE: knowledge_agent
      MYSQL_USER: ka_user
      MYSQL_PASSWORD: ${DB_PASS:-ka_pass_2024}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ka-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASS:-ka_redis_dev_2026}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ka-etcd
    restart: always
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "127.0.0.1:2379:2379"

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: ka-minio
    restart: always
    command: minio server /minio_data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: ka-milvus
    restart: always
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"

  # === 应用服务（先 npm run build，再 docker compose up）===
  backend:
    container_name: ka-backend
    build: ../backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KA_DEEPSEEK_API_KEY: ${KA_DEEPSEEK_API_KEY:-}
      # P0：内部密钥 + Agent 地址 + Redis 口令
      AGENT_URL: http://agent:8000
      AGENT_API_KEY: ${KA_INTERNAL_API_KEY:?KA_INTERNAL_API_KEY 必须设置}
      REDIS_PASSWORD: ${REDIS_PASS:-ka_redis_dev_2026}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    container_name: ka-agent
    build: ../agent
    restart: always
    environment:
      KA_DEEPSEEK_API_KEY: ${KA_DEEPSEEK_API_KEY:-}
      # P0：内部鉴权密钥（与 backend AGENT_API_KEY 保持一致）
      KA_INTERNAL_API_KEY: ${KA_INTERNAL_API_KEY:?KA_INTERNAL_API_KEY 必须设置}
      KA_REDIS_PASSWORD: ${REDIS_PASS:-ka_redis_dev_2026}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
    depends_on:
      - milvus

  nginx:
    container_name: ka-nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../frontend/dist:/var/www/ka:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - agent

volumes:
  mysql_data:
  redis_data:
  minio_data:
