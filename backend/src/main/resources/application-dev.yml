# 开发环境配置
# 激活: java -jar app.jar --spring.profiles.active=dev
# 或: mvn spring-boot:run -Dspring-boot.run.profiles=dev

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/knowledge_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&connectionCollation=utf8mb4_unicode_ci
    username: ka_user
    password: ka_pass_2024
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  data:
