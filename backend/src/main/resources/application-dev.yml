# 开发环境配置
# 激活: java -jar app.jar --spring.profiles.active=dev
# 或: mvn spring-boot:run -Dspring-boot.run.profiles=dev

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/knowledge_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&connectionCollation=utf8mb4_unicode_ci
    # P0：口令一律走环境变量（.env / start.bat），仓库不写死
    username: ${DB_USER:ka_user}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  data:
    redis:
      host: localhost
      port: 6379
      # 本地 Redis 无口令时留空；docker-compose 部署会注入 REDIS_PASSWORD
      password: ${REDIS_PASSWORD:}

# JWT 签名密钥（从环境变量注入；start.bat 会从 .env 加载）
jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.ka: DEBUG
    org.springframework.security: INFO
