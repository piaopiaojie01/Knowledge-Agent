# 生产环境配置
# 激活: java -jar app.jar --spring.profiles.active=prod
# 敏感信息通过环境变量注入，不写入文件

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/knowledge_agent?useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:ka_user}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    com.ka: WARN
    org.springframework.security: WARN
