spring:

  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
    to: ${MAIL_TO:admin@company.com}

  application:
    name: knowledge-agent-backend

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null

  http:
    encoding:
      charset: UTF-8
      force: true

  messages:
    encoding: UTF-8

jwt:
  # 生产环境必须通过 JWT_SECRET 环境变量注入，不提供默认值（缺失即启动失败）
  secret: ${JWT_SECRET}
  expiration: 86400000

agent:
  base-url: ${AGENT_URL:http://localhost:8000}
  # P0：调用 Agent 的内部鉴权密钥（与 Agent 侧 KA_INTERNAL_API_KEY 保持一致）
  api-key: ${AGENT_API_KEY:}
  connect-timeout: 5000
  read-timeout: 60000

# ==== 应用业务常量（消除硬编码）====
ka:
  cors-origins:
    - http://localhost:8080
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:9888
    - https://knowledge-agent.your-company.com
  rate-limit-rpm: 60
  rate-limit-whitelist:
    - /api/auth/login
    - /api/auth/refresh
    - /api/health
    - /favicon.ico
  jwt-blacklist-enabled: true
  max-upload-mb: 100
  cors-allow-trycloudflare: false
  chart-dir: ${KA_CHART_DIR:charts}
  icon-dir: ${KA_ICON_DIR:icons}
  llm:
    default-model: deepseek-v4-flash
    default-base-url: https://api.deepseek.com
  login-max-failures: 5
  login-lock-minutes: 30
  audit-retention-days: 365
  password-min-length: 8
